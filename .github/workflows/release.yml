name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run lint && npm --prefix frontend run typecheck && npm --prefix frontend test && npm --prefix frontend run build
      - run: go test -race ./...
        working-directory: backend
      - name: Go vulnerability audit
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        working-directory: backend
      - run: npm --prefix frontend audit --audit-level=high
      - run: python3 tests/installer_test.py
      - name: Real sing-box and browser integration
        run: bash scripts/ci-browser.sh
      - name: Isolated systemd installation and rollback scenarios
        run: bash tests/installer/systemd.sh
      - name: Existing custom installation discovery
        run: bash tests/installer/custom-service.sh
      - name: Package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/package.sh "$RELEASE_TAG"
      - name: Publish versioned assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/*.tar.gz artifacts/SHA256SUMS --verify-tag --generate-notes
