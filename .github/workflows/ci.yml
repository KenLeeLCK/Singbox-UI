name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run lint && npm --prefix frontend run typecheck && npm --prefix frontend test && npm --prefix frontend run build
      - run: go test -race ./...
        working-directory: backend
      - name: Go vulnerability audit
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        working-directory: backend
      - run: npm --prefix frontend audit --audit-level=high
      - run: python3 tests/installer_test.py
      - name: Real sing-box and browser integration
        run: bash scripts/ci-browser.sh
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ github.run_attempt }}
          path: .local/browser-artifacts/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - run: bash -n scripts/*.sh
      - run: bash scripts/package.sh v0.0.0-ci
      - name: Isolated systemd installation and rollback scenarios
        run: bash tests/installer/systemd.sh
      - name: Existing custom installation discovery
        run: bash tests/installer/custom-service.sh
